---
- name: Wait SSH connection
  hosts: tag_Name_dev_server
  gather_facts: False
  tasks:
    - name: Wait SSH connection
      wait_for:
        port: 22
        delay: 10
        timeout: 120
        search_regex: OpenSSH
        host: '{{ (ansible_ssh_host|default(ansible_host))|default(inventory_hostname) }}'
      vars:
        ansible_connection: local
        ansible_python_interpreter: /usr/bin/python3

- name: Install Docker
  hosts: tag_Name_dev_server
  become: yes
  tasks:
    - name: Install Docker
      yum:
        name: docker
        update_cache: yes
        state: present

    - name: Start docker daemon
      systemd:
        name: docker
        state: started

- name: Create new user
  hosts: tag_Name_dev_server
  vars_files: project-vars
  become: yes
  tasks:
    - name: Create new user
      user:
        name: dockeruser
        groups: "{{user_groups}}"
        append: yes

- name: Install docker-compose
  hosts: tag_Name_dev_server
  become: yes
  become_user: dockeruser
  tasks:
    - name: Create docker-compose directory
      file:
        path: ~/.docker/cli-plugins
        state: directory

    - name: Get arcthitecture of remote machine
      shell: uname -m
      register: remote_arch

    - name: Install docker-compose
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{remote_arch.stdout}}"
        dest: ~/.docker/cli-plugins/docker-compose
        mode: +x

- name: Start docker containers
  hosts: tag_Name_dev_server
  become: yes
  become_user: dockeruser
  vars_files: project-vars
  tasks:
    - name: copy docker compose
      copy:
        src: docker-compose.yaml
        dest: /home/dockeruser/docker-compose.yaml

    - name: Docker login
      docker_login:
        username: emrearabacioglu
        password: "{{docker_password}}"

    - name: Start containers
      community.docker.docker_compose_v2:
        project_src: /home/dockeruser