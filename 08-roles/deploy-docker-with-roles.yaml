---
- name: Install Docker
  hosts: all
  become: yes
  tasks:
    - name: Install Docker
      yum:
        name: docker
        update_cache: yes
        state: present

    - name: Start docker daemon
      systemd:
        name: docker
        state: started

- name: Create new user
  hosts: all
  vars_files: project-vars
  become: yes
  vars:
    user_groups: adm,docker
  roles:
    - create_user

- name: Install docker-compose
  hosts: all
  become: yes
  become_user: dockeruser
  tasks:
    - name: Create docker-compose directory
      file:
        path: ~/.docker/cli-plugins
        state: directory

    - name: Get arcthitecture of remote machine
      shell: uname -m
      register: remote_arch

    - name: Install docker-compose
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{remote_arch.stdout}}"
        dest: ~/.docker/cli-plugins/docker-compose
        mode: +x

- name: Start docker containers
  hosts: all
  become: yes
  become_user: dockeruser
  vars_files: project-vars
  roles:
    - start_containers
